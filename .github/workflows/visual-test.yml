name: Build and Visual Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser test tools
        run: |
          npm init -y
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start static website
        run: |
          python3 -m http.server 4173 > /tmp/nararya-server.log 2>&1 &
          echo $! > /tmp/nararya-server.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/image-motion.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/nararya-server.log
          exit 1
      - name: Test UI and capture screenshots
        run: |
          mkdir -p artifacts
          cat > smoke-test.cjs <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1440,height:1000}, deviceScaleFactor:1});
            const errors = [];
            page.on('pageerror', e => errors.push(e.message));
            await page.goto('http://127.0.0.1:4173/image-motion.html', {waitUntil:'networkidle'});
            const manifestResponse = await page.request.get('http://127.0.0.1:4173/manifest.webmanifest');
            if (!manifestResponse.ok()) throw new Error('PWA manifest did not load');
            const manifest = await manifestResponse.json();
            if (manifest.name !== 'Nararya Groub Visual Generator' || manifest.display !== 'standalone') throw new Error('PWA manifest metadata is invalid');
            if (!manifest.icons?.some(icon => icon.src === './assets/icon.svg')) throw new Error('PWA manifest does not reference the branded app icon');
            const iconResponse = await page.request.get('http://127.0.0.1:4173/assets/icon.svg');
            if (!iconResponse.ok() || !(await iconResponse.text()).includes('<svg')) throw new Error('Branded PWA icon did not load');
            const workerResponse = await page.request.get('http://127.0.0.1:4173/service-worker.js');
            if (!workerResponse.ok() || !(await workerResponse.text()).includes('addAll(APP_FILES)')) throw new Error('Offline service worker did not load or lacks app precache');
            await page.waitForTimeout(500);
            const swRegistered = await page.evaluate(() => navigator.serviceWorker.getRegistration().then(reg => Boolean(reg)));
            if (!swRegistered) throw new Error('Service worker did not register');
            await page.screenshot({path:'artifacts/image-motion-desktop.png', fullPage:true});
            await page.locator('.theme-toggle').click();
            if (await page.locator('html').getAttribute('data-theme') !== 'light') throw new Error('Light theme did not activate');
            await page.screenshot({path:'artifacts/image-motion-light.png', fullPage:true});
            await page.locator('.theme-toggle').click();
            for (const id of ['upload','preset','canvasWidth','canvasHeight','aspectPreset','pngCopies','applySize','zoomStart','zoomEnd','moveX','moveY','rotateEnd','transitionIn','transitionOut','duration','intensity','play','export','projectId','liveClock','liveStatus','aiPrompt','applyAI','saveProject','loadProject']) {
              if (await page.locator('#'+id).count() !== 1) throw new Error('Missing UI element: '+id);
            }
            await page.locator('#aiPrompt').fill('zoom pelan selama 8 detik');
            await page.locator('#applyAI').click();
            if (!(await page.locator('#aiResult').innerText()).includes('Zoom In')) throw new Error('AI assistant did not apply the prompt');
            if (!(await page.locator('#projectId').innerText()).startsWith('NG-MOTION-')) throw new Error('Project ID was not generated');
            await page.waitForTimeout(400);
            const autosaved = await page.evaluate(() => JSON.parse(localStorage.getItem('nararya-image-motion-project-v1') || 'null'));
            if (!autosaved || autosaved.settings.duration !== '8') throw new Error('Real-time local autosave did not persist prompt settings');
            await page.locator('#canvasWidth').fill('1080');
            await page.locator('#canvasHeight').fill('1920');
            await page.locator('#aspectPreset').selectOption('9:16');
            await page.locator('#applySize').click();
            if (await page.locator('#stage').evaluate(el=>el.width) !== 1080) throw new Error('Custom canvas width was not applied');
            if (await page.locator('#stage').evaluate(el=>el.height) !== 1920) throw new Error('Custom canvas height was not applied');
            await page.locator('#preset').selectOption('custom');
            await page.locator('#zoomEnd').fill('165');
            await page.locator('#transitionIn').selectOption('fade');
            await page.locator('#transitionOut').selectOption('slide-left');
            await page.locator('#play').click();
            await page.waitForTimeout(250);
            await page.locator('#play').click();
            await page.setViewportSize({width:390,height:844});
            await page.screenshot({path:'artifacts/image-motion-mobile.png', fullPage:true});
            // Smoke-test every public tool page, not just the animation studio.
            for (const [path, selector] of [
              ['/index.html', '.tool-grid'],
              ['/strobo.html', 'canvas'],
              ['/running-text.html', 'canvas']
            ]) {
              await page.goto('http://127.0.0.1:4173'+path, {waitUntil:'networkidle'});
              if (await page.locator(selector).count() < 1) throw new Error('Page smoke test failed: '+path+' missing '+selector);
              await page.screenshot({path:'artifacts/'+path.replaceAll('/','').replace('.html','')+'-smoke.png', fullPage:true});
            }
            if (errors.length) throw new Error('Browser JS errors: '+errors.join(' | '));
            await browser.close();
            console.log('PASS: homepage, strobo, running text, animation controls, prompt assistant, autosave, theme, PWA manifest, service worker registration, responsive layout, and screenshots.');
          })().catch(e => { console.error(e); process.exit(1); });
          EOF
          node smoke-test.cjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nararya-visual-test-screenshots
          path: artifacts/
          if-no-files-found: warn
